name: Daily 6AM HKT Backup

on:
  schedule:
    # 每天 UTC 22:00 (即香港時間 HKT 早上 06:00) 執行
    - cron: '0 22 * * *'
  # 允許手動觸發，方便測試
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-backup-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 確保能抓到完整的 git 歷史

      - name: Create and Push Backup Tag
        run: |
          # 取得當前 HKT 時間作為標籤名稱
          # 注意：GitHub Runner 預設為 UTC 時間，這裡用簡單的 date 生成
          # 為了避免標籤重複導致報錯，加入 run_number 以防萬一
          TAG_NAME="backup-$(date +'%Y%m%d')-${{ github.run_number }}"
          echo "Creating tag: $TAG_NAME"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a $TAG_NAME -m "Automated daily backup at 6AM HKT"
          git push origin $TAG_NAME
